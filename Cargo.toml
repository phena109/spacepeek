[package]
name = "spacepeek"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "spacepeek"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
