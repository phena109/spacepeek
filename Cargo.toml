[package]
name = "spacepeek"
version = "0.0.1"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "spacepeek"
path = "src/lib.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# 0.25.10 needs rustc 1.88 (`as_chunks`). 0.25.9 is the newest 0.25 that builds on 1.85.
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "webp"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
resvg = { version = "0.50", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # Windows.Data.Pdf, used only after a file is already a PDF.
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "implement",
] }
