[package]
name = "pdf_measure"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Measure Windows.Data.Pdf first-page render time at Spacepeek preview size"

[[bin]]
name = "pdf_measure"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
